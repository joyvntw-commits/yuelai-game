<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>悅來越式料理｜美味泡泡龍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Be+Vietnam+Pro:wght@500;700&family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
:root {
  --ink: #10243E;
  --paper: #FBF1DC;
  --paper-2: #FFF9EA;
  --navy: #12395E;
  --navy-2: #184A78;
  --board: #0F2A47;
  --orange: #F28A1E;
  --orange-d: #A84A06;
  --blue: #1F5E9E;
  --sky: #BFD9F2;
  --muted: #4A5F7A;
  --danger: #B3261E;
  --font: 'Be Vietnam Pro', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Noto Serif TC', 'Songti TC', serif;
  --font-slab: 'Alfa Slab One', 'Noto Serif TC', serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background-color: var(--navy);
  background-image:
    linear-gradient(45deg, var(--navy-2) 25%, transparent 25%, transparent 75%, var(--navy-2) 75%),
    linear-gradient(45deg, var(--navy-2) 25%, transparent 25%, transparent 75%, var(--navy-2) 75%);
  background-size: 40px 40px;
  background-position: 0 0, 20px 20px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  display: flex;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
}
.app {
  width: 100%;
  max-width: 440px;
  padding: 12px 14px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
[hidden] { display: none !important; }
.ic { flex: none; vertical-align: middle; }

/* 招牌 */
.sign { border: 3px solid var(--ink); border-radius: 8px; box-shadow: 4px 4px 0 var(--ink); background: var(--paper); overflow: hidden; }
.awning { height: 14px; border-bottom: 3px solid var(--ink); background: repeating-linear-gradient(90deg, var(--orange) 0 22px, var(--paper) 22px 44px); }
.sign-body { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; }
.kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--blue); }
.brand-name { font-family: var(--font-serif); font-weight: 900; font-size: 22px; line-height: 1.2; }
.brand-sub { font-size: 12px; font-weight: 700; color: var(--muted); }
.btn-ticket {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
  background: var(--ink); color: var(--paper); border: 0; border-radius: 4px; padding: 9px 10px;
  font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 var(--orange);
}
.btn-ticket:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--orange); }
.ticket-count { background: var(--orange); color: var(--ink); border-radius: 3px; padding: 0 6px; font-size: 12px; }

.strip { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px; font-size: 11px; font-weight: 700; color: var(--paper); }
.pill { border: 2px solid var(--ink); border-radius: 999px; padding: 1px 10px; font-size: 11px; font-weight: 700; white-space: nowrap; color: var(--ink); }
.pill.available { background: #9CCB3B; }
.pill.claimed { background: #D8D2C4; }

/* 分數 */
.score-card { display: flex; align-items: center; gap: 12px; background: var(--paper); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 4px 4px 0 var(--ink); padding: 8px 12px; }
.score-label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted); }
.score-num { font-family: var(--font-slab); font-size: 28px; line-height: 1.05; color: var(--orange-d); font-variant-numeric: tabular-nums; }
.score-num small { font-family: var(--font); font-size: 11px; color: var(--muted); font-weight: 700; }
.ruler { flex: 1; min-width: 0; position: relative; height: 40px; }
.ruler-track { height: 16px; border: 3px solid var(--ink); border-radius: 3px; background: var(--sky); overflow: hidden; }
.ruler-fill { width: 0%; height: 100%; background: repeating-linear-gradient(-45deg, var(--orange) 0 8px, #D96A0A 8px 16px); transition: width 0.3s ease; }
.ruler-mark { position: absolute; left: 53.8%; top: -3px; width: 3px; height: 22px; background: var(--ink); }
.ruler-l1 { position: absolute; left: 53.8%; top: 22px; transform: translateX(-50%); font-size: 10px; font-weight: 700; white-space: nowrap; }
.ruler-l2 { position: absolute; right: 0; top: 22px; font-size: 10px; font-weight: 700; color: var(--orange-d); white-space: nowrap; }
.stamp { flex: none; border: 2.5px solid var(--orange-d); color: var(--orange-d); border-radius: 4px; padding: 3px 8px; transform: rotate(-3deg); text-align: center; line-height: 1.2; }
.stamp b { display: block; font-size: 14px; }
.stamp span { font-size: 10px; font-weight: 700; }

.claim-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #9CCB3B; border: 3px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink); padding: 6px 10px; font-size: 12px; font-weight: 700; }
.claim-bar button { font: inherit; font-weight: 700; background: var(--ink); color: var(--paper); border: 0; border-radius: 4px; padding: 8px 10px; min-height: 36px; cursor: pointer; }

/* 點單 */
.orders { display: flex; align-items: stretch; gap: 8px; }
.order-tag { flex: none; display: flex; align-items: center; background: var(--blue); color: var(--paper); border: 2.5px solid var(--ink); border-radius: 4px; padding: 0 8px; font-size: 13px; font-weight: 700; writing-mode: vertical-rl; letter-spacing: 0.2em; }
.order { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--paper-2); border: 2.5px solid var(--ink); border-radius: 4px; padding: 5px 8px; box-shadow: 3px 3px 0 var(--ink); }
.order.done { animation: bump 0.5s ease; }
@keyframes bump { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.05) rotate(-1deg); } }
.order-name { font-size: 13px; font-weight: 700; white-space: nowrap; }
.pips { display: flex; gap: 2px; margin-top: 4px; flex-wrap: wrap; }
.pips i { width: 9px; height: 9px; background: var(--paper); border: 1.5px solid var(--ink); }
.pips i.on { background: var(--orange); }

/* 盤面 */
.board-wrap {
  border: 3px solid var(--ink); border-radius: 10px; box-shadow: 5px 5px 0 var(--ink);
  background-color: var(--board);
  background-image: radial-gradient(#1A3F66 1px, transparent 1.6px);
  background-size: 8px 8px;
  line-height: 0; overflow: hidden;
}
canvas { display: block; width: 100%; aspect-ratio: 380 / 520; touch-action: none; cursor: crosshair; }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: var(--paper); padding: 0 2px; }
.foot .diamond { color: var(--orange); }
.btn-demo { font: inherit; font-size: 11px; font-weight: 700; background: var(--paper); color: var(--ink); border: 2px dashed var(--orange-d); border-radius: 6px; padding: 4px 8px; cursor: pointer; }

/* 彈窗 */
.modal-overlay { position: fixed; inset: 0; background: rgba(8, 22, 40, 0.78); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
.modal-overlay.active { display: flex; }
.modal-card { width: 100%; max-width: 400px; max-height: 92vh; overflow-y: auto; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 6px 6px 0 var(--ink); text-align: center; animation: pop 0.22s ease; }
.modal-card .awning { margin-bottom: 14px; }
.modal-in { padding: 0 16px 16px; }
@keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-icon { margin-bottom: 4px; }
.modal-kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--blue); }
.modal-title { font-family: var(--font-serif); font-weight: 900; font-size: 24px; line-height: 1.25; margin: 2px 0 6px; text-wrap: balance; }
.modal-sub { margin: 0 0 12px; font-size: 13px; line-height: 1.65; color: var(--muted); }
.modal-sub strong { color: var(--ink); }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; margin-top: 10px; font-family: var(--font); font-weight: 700; font-size: 15px; color: var(--ink); background: var(--paper-2); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 4px 4px 0 var(--ink); cursor: pointer; }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:focus-visible, .btn-ticket:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
.btn.primary { background: var(--orange); font-family: var(--font-serif); font-weight: 900; font-size: 19px; letter-spacing: 0.12em; }
.btn.navy { background: var(--ink); color: var(--paper); }
.btn:disabled { background: #D8D2C4; cursor: not-allowed; box-shadow: 2px 2px 0 var(--ink); transform: translate(2px, 2px); }

.pin-input { width: 170px; font: inherit; font-size: 26px; font-weight: 700; letter-spacing: 8px; text-align: center; padding: 8px; border: 3px solid var(--ink); border-radius: 6px; background: #fff; color: var(--ink); margin: 6px 0; user-select: text; -webkit-user-select: text; }
.pin-input:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.pin-err { color: var(--danger); font-size: 12px; font-weight: 700; margin: 2px 0 6px; display: none; }

.pool-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px; margin: 14px 0 14px; }
.pool-box { position: relative; background: var(--paper-2); border: 2.5px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink); padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: transform 0.1s ease, background 0.1s ease, box-shadow 0.1s ease; }
.pool-box.highlight { background: var(--orange); transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
.pool-box.grand { background: #FFE7A8; padding-top: 14px; }
.pool-box.grand.highlight { background: var(--orange); }
.grand-tag { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); border-radius: 3px; padding: 0 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; white-space: nowrap; }
.pool-label { font-size: 11px; font-weight: 700; line-height: 1.35; }
.fine { font-size: 11px; line-height: 1.6; color: var(--muted); margin: 10px 0 0; }

.coupon-card { position: relative; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; background: #fff; border: 2.5px dashed var(--ink); border-radius: 8px; padding: 14px; margin: 10px 0; text-align: left; overflow: hidden; }
.coupon-card.grand-prize { background: #FFF0C2; border-style: solid; }
.coupon-card.consolation { background: #E8F1FA; }
.coupon-card.used { opacity: 0.55; background: #E6E1D6; }
.coupon-icon { width: 56px; height: 56px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; flex: none; }
.coupon-body { flex: 1 1 160px; min-width: 0; }
.coupon-tag { display: inline-block; background: var(--orange); color: var(--ink); border: 2px solid var(--ink); font-size: 11px; font-weight: 700; padding: 0 8px; border-radius: 3px; margin-bottom: 6px; }
.grand-prize .coupon-tag { background: var(--ink); color: var(--paper); }
.consolation .coupon-tag { background: var(--blue); color: var(--paper); }
.coupon-name { font-size: 15px; font-weight: 700; margin: 0 0 4px; line-height: 1.4; }
.coupon-desc { font-size: 12px; color: var(--muted); line-height: 1.55; margin: 0; }
.live-security { flex: 1 1 100%; background: var(--paper); border-radius: 4px; padding: 5px 10px; font-size: 10.5px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.live-dot { display: inline-block; width: 8px; height: 8px; background: #3FA46B; border: 1.5px solid var(--ink); border-radius: 50%; margin-right: 5px; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.btn-redeem { flex: 1 1 100%; position: relative; overflow: hidden; background: var(--ink); color: var(--paper); border: 2.5px solid var(--ink); border-radius: 6px; padding: 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 var(--orange); touch-action: none; }
.redeem-progress { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--danger); z-index: 1; }
.redeem-text { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 6px; }
.stamp-used { position: absolute; right: 12px; top: 18px; border: 3px solid var(--danger); color: var(--danger); font-weight: 700; font-size: 16px; padding: 2px 10px; border-radius: 4px; transform: rotate(-12deg); pointer-events: none; background: rgba(255, 255, 255, 0.75); }
.empty-wallet { color: var(--muted); padding: 24px 0; font-size: 13px; line-height: 1.7; }

@media (prefers-reduced-motion: reduce) {
  .modal-card, .order.done, .live-dot { animation: none; }
  .ruler-fill { transition: none; }
}
</style>
</head>
<body>
<div class="app">

  <header class="sign">
    <div class="awning"></div>
    <div class="sign-body">
      <div style="min-width:0">
        <div class="kicker">Gốc ẩm thực Vị Lai</div>
        <div class="brand-name">悅來越式料理</div>
        <div class="brand-sub">招牌美味泡泡龍</div>
      </div>
      <button class="btn-ticket" onclick="openWallet()" aria-label="開啟票券夾">
        <span data-icon="ticket" data-size="18" data-flat="1"></span>票券夾 <span class="ticket-count" id="ticketCount">0</span>
      </button>
    </div>
  </header>

  <div class="strip">
    <span><span data-icon="lock" data-size="14" data-flat="1"></span> 限店內消費解鎖領獎（每日限 1 次）</span>
    <span class="pill available" id="dailyQuotaBadge">今日可領取 (1/1)</span>
  </div>

  <div class="score-card">
    <div style="flex:none">
      <div class="score-label">SCORE</div>
      <div class="score-num"><span id="scoreText">0</span></div>
    </div>
    <div class="ruler" aria-label="分數進度">
      <div class="ruler-track"><div class="ruler-fill" id="progressFill"></div></div>
      <div class="ruler-mark" id="rulerMark"></div>
      <div class="ruler-l1" id="rulerL1">3,500 飲料券</div>
      <div class="ruler-l2" id="rulerL2">6,500 六選一</div>
    </div>
    <div class="stamp"><b id="shotsLeftText">剩 7 發</b><span>天花板下移</span></div>
  </div>

  <div class="claim-bar" id="claimBar" hidden>
    <span>已達 <span id="claimScoreLabel">3,500</span> 分！可領飲料加購券</span>
    <button onclick="openConfirmClaimModal()">現在領取（結束本局）</button>
  </div>

  <div class="orders" id="ordersRow">
    <div class="order-tag">點單</div>
    <div class="order" id="order0"></div>
    <div class="order" id="order1"></div>
  </div>

  <div class="board-wrap"><canvas id="gameCanvas" aria-label="泡泡龍遊戲畫面"></canvas></div>

  <div class="foot">
    <span><span class="diamond">◆</span> <span id="footL1">3,500</span> 分 飲料加購券</span>
    <button class="btn-demo" id="btnDemo" onclick="triggerWinDemo()" hidden>測試抽盲盒</button>
    <span><span class="diamond">◆</span> <span id="footL2">6,500</span> 分 六選一盲盒</span>
  </div>
</div>

<!-- 誤觸二次確認彈窗 -->
<div class="modal-overlay" id="confirmClaimModal">
  <div class="modal-card">
    <div class="awning"></div>
    <div class="modal-in">
      <div class="modal-icon"><span data-icon="drink" data-size="56"></span></div>
      <h2 class="modal-title">確定現在領取鼓勵券嗎？</h2>
      <p class="modal-sub">領取「80 元招牌飲料加購 50 元優惠券」後，<strong>本局將直接結算，且今日無法再開啟 6 大好禮盲盒</strong>。<br>若想拚 6 大好禮盲盒，可繼續挑戰至 <strong id="confirmTargetText">6,500</strong> 分！</p>
      <button class="btn primary" onclick="closeModal('confirmClaimModal'); claimNow();">確定直接領取飲料券</button>
      <button class="btn" onclick="closeModal('confirmClaimModal')">繼續挑戰衝盲盒！</button>
    </div>
  </div>
</div>

<!-- 店內密碼 -->
<div class="modal-overlay" id="storePinModal">
  <div class="modal-card">
    <div class="awning"></div>
    <div class="modal-in">
      <div class="modal-icon"><span data-icon="key" data-size="56"></span></div>
      <h2 class="
